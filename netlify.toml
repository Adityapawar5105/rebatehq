[build]
  command = "pnpm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24.22.1" # review R1: the same Node as CI (24.22.3 crashed V8 at test exit)
  PNPM_VERSION = "10.11.0"
  PNPM_FLAGS = "--shamefully-hoist"
  VAULT_LAB_ENABLED = "false"
  DEV_IMPERSONATION_ENABLED = "false"
  RELAY_ENABLED = "false"
  BENCHMARKS_ENABLED = "false"

[functions]
  included_files = ["certs/supabase-root-ca.crt"]

# Netlify detects Next.js and supplies its OpenNext adapter. This is not a
# static-export deployment: sign-in, callbacks and licences need functions.
# The nonce CSP remains in proxy.ts; never replace it with a static CSP here.
[[headers]]
  for = "/spike/*"
  [headers.values]
    Cross-Origin-Resource-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    X-Content-Type-Options = "nosniff"

name: RebateHQ CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Roadmap 13.9 (21 Nov 2026): three jobs run in parallel and `verify` passes only when all three pass, so a failure in
# one browser gate no longer repeats everything else and the run ends sooner. `verify` keeps the check name that
# branch protection and the merge rule use; it runs even when a job fails, so a failure can never read as "skipped".
jobs:
  unit:
    name: unit tests, audit and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          # Pinned (21 Nov 2026): CI #194 on Node 24.22.3 crashed in V8 ("jit_page allocations" check) while a passing
          # WebAssembly test file exited. 24.22.1 is the version every local run uses. Raise it deliberately, not implicitly.
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reject high and critical dependency advisories
        run: pnpm audit --audit-level high
      - name: Generate disposable signing keys (masked)
        run: node scripts/control-plane-keys.mjs --ci-env
      - name: Verify applied migration hashes
        run: pnpm check:migrations-lock
      - run: pnpm typecheck
      - name: Unit tests (one rerun only after the known V8 exit crash)
        # CI #194 (Node 24.22.3) and PR #22 (Node 24.22.1, 22 Nov 2026): V8 aborts while a test process that used
        # WebAssembly exits ("jit_page_->allocations_.erase"), after every test in it has passed. Pinning Node did not
        # stop it. The suite is rerun once only when that signature is present and no assertion failed; any real
        # failure still fails the job, and the crash stays visible as a warning. CI #240 (25 Nov 2026) hit the same
        # family as a glibc heap abort ("corrupted size vs. prev_size") inside a PGlite test file, before its other
        # tests ran; the rerun runs the whole suite again, so nothing goes untested.
        shell: bash
        run: |
          set +e
          pnpm test 2>&1 | tee test-output.log; code=${PIPESTATUS[0]}
          if [ "$code" != 0 ] && grep -qE "jit_page_->allocations_.erase|corrupted size vs. prev_size" test-output.log && ! grep -qE "AssertionError|not ok [0-9]" test-output.log; then
            echo "::warning::A test process crashed natively (V8 or the C heap) with no assertion failure; rerunning the unit tests once."
            pnpm test; code=$?
          fi
          exit $code
      - run: pnpm build
  chromium:
    name: database tests and Chromium privacy and relay gates
    runs-on: ubuntu-24.04
    # CI #87 ran for six hours when the apt mirror stalled inside playwright install: every job has a limit.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          # Pinned (21 Nov 2026): CI #194 on Node 24.22.3 crashed in V8 ("jit_page allocations" check) while a passing
          # WebAssembly test file exited. 24.22.1 is the version every local run uses. Raise it deliberately, not implicitly.
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate disposable signing keys (masked)
        run: node scripts/control-plane-keys.mjs --ci-env
      - name: Start local Supabase services
        # CI #196 and PR #21's first run (21-22 Nov 2026): the runner's Docker failed to set up container networking
        # ("driver failed programming external connectivity"), and a plain retry hit the same broken daemon. Each
        # retry now stops cleanly, prunes leftover networks and restarts Docker before starting again (two retries).
        shell: bash
        run: |
          start() { pnpm exec supabase start -x studio,edge-runtime,imgproxy,logflare,vector; }
          for attempt in 1 2 3; do
            if start; then exit 0; fi
            [ "$attempt" = 3 ] && break
            echo "::warning::Supabase did not start (attempt $attempt); restarting Docker and retrying."
            pnpm exec supabase stop --no-backup || true
            docker network prune -f || true
            sudo systemctl restart docker
            for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
            sleep 5
          done
          exit 1
      - name: Apply every migration to the clean local database
        env:
          PGOPTIONS: -c client_min_messages=warning
        run: |
          set -o pipefail
          migration_log="$RUNNER_TEMP/migration-reset.log"
          pnpm exec supabase db reset 2>&1 | tee "$migration_log"
          if grep -Eiq 'no privileges (were granted|could be revoked|were revoked)' "$migration_log"; then
            echo "::error::Migration emitted a warning for an ineffective GRANT or REVOKE."
            exit 1
          fi
      - name: Export local database URLs for this job
        shell: bash
        run: |
          pnpm exec supabase status --output env > "$RUNNER_TEMP/supabase-status.env"
          db_url="$(sed -n 's/^DB_URL=//p' "$RUNNER_TEMP/supabase-status.env" | head -n 1 | sed 's/^"//; s/"$//')"
          if [[ -z "$db_url" ]]; then
            echo "Supabase CLI status did not return DB_URL." >&2
            exit 1
          fi
          {
            printf 'SEED_DATABASE_URL=%s\n' "$db_url"
            printf 'TEST_DATABASE_URL=%s\n' "$db_url"
          } >> "$GITHUB_ENV"
      - name: Install private audit signer key
        run: node scripts/control-plane-keys.mjs --install
      - name: Create restricted app login (pgTAP creates disposable test users)
        run: pnpm setup:test-db-role
      - name: Verify runtime pool role and missing-auth isolation
        run: pnpm check:db-role
      - name: Run RLS, tenant isolation, role, and append-only database tests
        run: pnpm test:db:repeat
      - name: Export real local Auth configuration for the required privacy gate
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const text=fs.readFileSync(process.env.RUNNER_TEMP+'/supabase-status.env','utf8');
          const entries=Object.fromEntries(text.split('\n').filter(l=>l.includes('=')).map(l=>{const i=l.indexOf('=');return [l.slice(0,i),l.slice(i+1).replace(/^"|"$/g,'')]}));
          const values={NEXT_PUBLIC_SUPABASE_URL:entries.API_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:entries.PUBLISHABLE_KEY||entries.ANON_KEY,VAULT_MAIL_URL:entries.MAILPIT_URL||entries.INBUCKET_URL,VAULT_TEST_URL:'http://localhost:3000',APP_BASE_URL:'http://localhost:3000'};
          for(const [key,value] of Object.entries(values)){if(!value)throw Error('Missing local-stack setting '+key);if(key.includes('KEY'))console.log('::add-mask::'+value);fs.appendFileSync(process.env.GITHUB_ENV,key+'='+value+'\n');}
          JS
      - name: Install Playwright Chromium and its system packages (bounded, retried)
        timeout-minutes: 25
        shell: bash
        run: bash scripts/ci-install-browser.sh chromium
      - name: Required authenticated local-vault privacy gate
        timeout-minutes: 25
        env:
          RELAY_ENABLED: "true"
          BENCHMARKS_ENABLED: "true"
        shell: bash
        run: |
          set -euo pipefail
          pnpm build
          pnpm start --hostname 0.0.0.0 --port 3000 > "$RUNNER_TEMP/vault-app.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || :' EXIT
          node --input-type=module <<'JS'
          let ready=false;for(let i=0;i<60;i++){try{if((await fetch('http://localhost:3000/login')).ok){ready=true;break}}catch{}await new Promise(r=>setTimeout(r,1000))}if(!ready)throw Error('App did not start for the privacy gate');
          JS
          pnpm test:vault:privacy --browser=chromium
          node scripts/test-relay-browser.mjs --auth --browser=chromium
          # Review R2 (SECURITY_REVIEW.md R27): the same build restarted with the relay off makes no relay, Storage or
          # Realtime request and opens no WebSocket (RELAY_ENABLED is read at run time, so no rebuild is needed).
          kill "$app_pid" 2>/dev/null || :
          pkill -f "next start" 2>/dev/null || :
          wait "$app_pid" 2>/dev/null || :
          # The pass also probes /api/relay for 404, but do not start until the old server has let go of the port.
          for i in $(seq 1 30); do curl -s -o /dev/null --max-time 2 http://localhost:3000/login || break; sleep 1; done
          if curl -s -o /dev/null --max-time 2 http://localhost:3000/login; then echo "::error::The relay-on server did not stop."; exit 1; fi
          RELAY_ENABLED=false pnpm start --hostname 0.0.0.0 --port 3000 > "$RUNNER_TEMP/vault-app-relay-off.log" 2>&1 &
          app_pid=$!
          node --input-type=module <<'JS'
          let ready=false;for(let i=0;i<60;i++){try{if((await fetch('http://localhost:3000/login')).ok){ready=true;break}}catch{}await new Promise(r=>setTimeout(r,1000))}if(!ready)throw Error('App did not restart for the relay-off pass');
          JS
          RELAY_ENABLED=false pnpm test:vault:privacy --browser=chromium --relay-off-only
      - name: Realtime server log after a relay gate failure (team sharing S4)
        if: failure()
        shell: bash
        run: |
          c="$(docker ps --format '{{.Names}}' | grep -i realtime | head -n 1)"
          if [ -n "$c" ]; then docker logs "$c" --tail 200 2>&1 | grep -viE "token|jwt|secret|apikey|password" | tail -n 120; fi
      - name: Upload privacy gate failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: chromium-privacy-gate-diagnostics
          # Screenshot and scrubbed result JSON only; the synthetic CSV fixtures stay on the runner.
          path: |
            test-results/*.png
            test-results/vault-*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local Supabase services
        if: always()
        run: pnpm exec supabase stop --no-backup
  firefox:
    name: Firefox lab gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          # Pinned (21 Nov 2026): CI #194 on Node 24.22.3 crashed in V8 ("jit_page allocations" check) while a passing
          # WebAssembly test file exited. 24.22.1 is the version every local run uses. Raise it deliberately, not implicitly.
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate disposable signing keys (masked)
        run: node scripts/control-plane-keys.mjs --ci-env
      - name: Start local Supabase services
        # CI #196 and PR #21's first run (21-22 Nov 2026): the runner's Docker failed to set up container networking
        # ("driver failed programming external connectivity"), and a plain retry hit the same broken daemon. Each
        # retry now stops cleanly, prunes leftover networks and restarts Docker before starting again (two retries).
        shell: bash
        run: |
          start() { pnpm exec supabase start -x studio,edge-runtime,imgproxy,logflare,vector; }
          for attempt in 1 2 3; do
            if start; then exit 0; fi
            [ "$attempt" = 3 ] && break
            echo "::warning::Supabase did not start (attempt $attempt); restarting Docker and retrying."
            pnpm exec supabase stop --no-backup || true
            docker network prune -f || true
            sudo systemctl restart docker
            for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
            sleep 5
          done
          exit 1
      - name: Apply every migration to the clean local database
        env:
          PGOPTIONS: -c client_min_messages=warning
        run: |
          set -o pipefail
          migration_log="$RUNNER_TEMP/migration-reset.log"
          pnpm exec supabase db reset 2>&1 | tee "$migration_log"
          if grep -Eiq 'no privileges (were granted|could be revoked|were revoked)' "$migration_log"; then
            echo "::error::Migration emitted a warning for an ineffective GRANT or REVOKE."
            exit 1
          fi
      - name: Export local database URLs for this job
        shell: bash
        run: |
          pnpm exec supabase status --output env > "$RUNNER_TEMP/supabase-status.env"
          db_url="$(sed -n 's/^DB_URL=//p' "$RUNNER_TEMP/supabase-status.env" | head -n 1 | sed 's/^"//; s/"$//')"
          if [[ -z "$db_url" ]]; then
            echo "Supabase CLI status did not return DB_URL." >&2
            exit 1
          fi
          {
            printf 'SEED_DATABASE_URL=%s\n' "$db_url"
            printf 'TEST_DATABASE_URL=%s\n' "$db_url"
          } >> "$GITHUB_ENV"
      - name: Install private audit signer key
        run: node scripts/control-plane-keys.mjs --install
      - name: Create restricted app login (pgTAP creates disposable test users)
        run: pnpm setup:test-db-role
      - name: Verify runtime pool role and missing-auth isolation
        run: pnpm check:db-role
      - name: Export real local Auth configuration for the required privacy gate
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const text=fs.readFileSync(process.env.RUNNER_TEMP+'/supabase-status.env','utf8');
          const entries=Object.fromEntries(text.split('\n').filter(l=>l.includes('=')).map(l=>{const i=l.indexOf('=');return [l.slice(0,i),l.slice(i+1).replace(/^"|"$/g,'')]}));
          const values={NEXT_PUBLIC_SUPABASE_URL:entries.API_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:entries.PUBLISHABLE_KEY||entries.ANON_KEY,VAULT_MAIL_URL:entries.MAILPIT_URL||entries.INBUCKET_URL,VAULT_TEST_URL:'http://localhost:3000',APP_BASE_URL:'http://localhost:3000'};
          for(const [key,value] of Object.entries(values)){if(!value)throw Error('Missing local-stack setting '+key);if(key.includes('KEY'))console.log('::add-mask::'+value);fs.appendFileSync(process.env.GITHUB_ENV,key+'='+value+'\n');}
          JS
      - run: pnpm build
      - name: Install Playwright Firefox and its system packages (bounded, retried)
        timeout-minutes: 25
        shell: bash
        run: bash scripts/ci-install-browser.sh firefox
      - name: Required Firefox local-vault lab gate
        timeout-minutes: 25
        env:
          VAULT_LAB_ENABLED: "true"
          VAULT_TEST_URL: "http://127.0.0.1:3001"
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3001 > "$RUNNER_TEMP/firefox-vault-app.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || :' EXIT
          node --input-type=module <<'JS'
          let ready=false;for(let i=0;i<60;i++){try{if((await fetch('http://127.0.0.1:3001/lab/vault')).ok){ready=true;break}}catch{}await new Promise(r=>setTimeout(r,1000))}if(!ready)throw Error('Lab app did not start for Firefox');
